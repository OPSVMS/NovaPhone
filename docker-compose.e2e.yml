# Entorno E2E aislado: Postgres + proxy HTTP tipo Neon + simulador de eSIM Access + app + Playwright.
# Uso: docker compose -f docker-compose.e2e.yml up --build --abort-on-container-exit --exit-code-from e2e
services:
  postgres:
    image: postgres:17
    environment: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: main }
    volumes: ["./drizzle:/docker-entrypoint-initdb.d:ro"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres -d main"], interval: 2s, retries: 30 }

  neon-proxy:
    image: ghcr.io/timowilhelm/local-neon-http-proxy:main
    environment: { PG_CONNECTION_STRING: "postgres://postgres:postgres@postgres:5432/main" }
    depends_on: { postgres: { condition: service_healthy } }

  mock:
    image: node:24-slim
    working_dir: /mock
    volumes: ["./e2e/mock:/mock:ro"]
    command: ["node", "server.mjs"]
    environment:
      APP_URL: "http://web:3000"
      MOCK_PUBLIC_URL: "http://mock:4010"
    healthcheck: { test: ["CMD", "node", "-e", "fetch('http://localhost:4010/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"], interval: 2s, retries: 30 }

  web:
    build: .
    environment:
      DATABASE_URL: "postgres://postgres:postgres@db.localtest.me:5432/main"
      NEON_HTTP_PROXY: "http://neon-proxy:4444/sql"
      ESIMACCESS_BASE_URL: "http://mock:4010"
      ESIMACCESS_ACCESS_CODE: "test-access-code"
      ESIMACCESS_WEBHOOK_TOKEN: "test-webhook-token"
      FX_URL: "http://mock:4010/fx"
      DEPOSITS_WEBHOOK_SECRET: "test-deposit-secret"
      CRON_SECRET: "test-cron-secret"
      SIGNING_SECRET: "test-signing-secret"
      ADMIN_EMAILS: "admin-desktop@novaphone.test,admin-mobile@novaphone.test"
      PRICE_MARKUP: "1.33"
      APP_URL: "http://web:3000"
      SPEI_CLABE: "646180000000000000"
      SPEI_BANK: "STP"
      SPEI_BENEFICIARY: "NovaPhone"
      USDT_NETWORK: "TRON (TRC20)"
      USDT_ADDRESS: "TTestAddressNovaPhone000000000000"
      NOVACORE_BASE_URL: "http://mock:4010"
      NOVACORE_API_KEY: "test-novacore-key"
      NOVACORE_SIGNING_SECRET: "test-novacore-signing"
      NOVACORE_CALLBACK_SECRET: "test-novacore-callback"
      OPENPAY_BASE_URL: "http://mock:4010"
      OPENPAY_MERCHANT_ID: "mtestmerchant"
      OPENPAY_PRIVATE_KEY: "sk_test_openpay"
      SMS_WEBHOOK_TOKEN: "test-sms-token"
      PHONE_NUMBER_PRICE_MXN: "79"
    depends_on:
      neon-proxy: { condition: service_started }
      mock: { condition: service_healthy }
    healthcheck: { test: ["CMD", "node", "-e", "fetch('http://localhost:3000/terminos').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"], interval: 5s, retries: 60, start_period: 60s }

  e2e:
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    working_dir: /e2e
    volumes: ["./e2e:/e2e"]
    environment:
      BASE_URL: "http://web:3000"
      DEPOSITS_WEBHOOK_SECRET: "test-deposit-secret"
      CRON_SECRET: "test-cron-secret"
      ESIMACCESS_WEBHOOK_TOKEN: "test-webhook-token"
      MOCK_URL: "http://mock:4010"
      SMS_WEBHOOK_TOKEN: "test-sms-token"
      NEON_SQL_URL: "http://neon-proxy:4444/sql"
      DB_URL: "postgres://postgres:postgres@db.localtest.me:5432/main"
      CI: "1"
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npx playwright test"]
    depends_on: { web: { condition: service_healthy } }
